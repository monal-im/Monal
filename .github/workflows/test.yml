name: Run automated tests

on:
  pull_request:
    branches:
      - develop
      - beta
      - stable
      - quicksy
  push:
    branches:
      - develop
      - oldstable/6.4-line
  workflow_dispatch:

permissions: {}

jobs:
  run_tests:
    runs-on: macos-15
    name: Run automated tests
    steps:
      - uses: actions/checkout@v6
        with:
          clean: true
          submodules: true
          fetch-depth: 100
          fetch-tags: true
          show-progress: true
          lfs: true
      - name: Checkout submodules
        run: git submodule update -f --init --remote
      - name: Select Xcode version
        run: sudo xcode-select -s '/Applications/Xcode_26.2.app/Contents/Developer'
      - name: Install coreutils
        run: brew install coreutils
      - name: Build rust
        run: bash ./rust/build-rust.sh
      - name: Install pods
        working-directory: Monal
        run: pod install --repo-update
      - name: Run tests
        working-directory: Monal
        run: |
          mkdir -p "$RUNNER_TEMP/test-artifacts"
          set -o pipefail && \
          NSUnbufferedIO=YES xcodebuild \
            -workspace Monal.xcworkspace \
            -scheme Monal \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath "$RUNNER_TEMP/test-artifacts/TestResults.xcresult" \
            test \
            2>&1 | \
          tee "$RUNNER_TEMP/test-artifacts/xcodebuild.log" | \
          stdbuf -oL -eL xcbeautify --renderer github-actions | \
          while IFS= read -r line; do \
            echo "$line"; \
            if [[ "$line" =~ "✔" ]]; then \
              echo "::notice ::${line}"; \
            fi; \
          done
      - name: Collect crash reports
        if: ${{ !cancelled() }}
        run: |
          if [ -d ~/Library/Logs/DiagnosticReports ]; then
            cp -R ~/Library/Logs/DiagnosticReports "$RUNNER_TEMP/test-artifacts/" || true
          fi
      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-artifacts
          if-no-files-found: ignore
          retention-days: 14
